<div hx-swap-oob="beforeend:#chat-room">
    <div class="message-ghost flex flex-col animate-[fadeIn_0.5s_ease-out] transition-opacity duration-1000">
        
        <div class="relative max-w-[85%] self-start group">
            <div class="absolute top-0 -left-2 w-2 h-2 border-t border-r border-purple-500 transform -rotate-45"></div>

            <div class="bg-gray-900/80 border-l-2 border-purple-500 p-3 shadow-lg backdrop-blur-sm">
                <div class="flex justify-between items-baseline mb-1 border-b border-white/5 pb-1">
                    <span class="font-term text-purple-400 uppercase tracking-widest text-xs">{{.DisplayName}}</span>
                    <span class="font-term text-xs text-gray-600">{{.Timestamp}}</span>
                </div>
                <p class="font-term text-lg text-gray-300 leading-snug tracking-wide">{{.Content}}</p>
            </div>
        </div>

        <script>
            (function() {
                // Get the specific message element this script is inside
                // document.currentScript.previousElementSibling refers to the div above
                const msg = document.currentScript.parentElement;
                
                // 1. Wait 60 seconds (60000ms)
                setTimeout(() => {
                    // 2. Start fading out
                    msg.style.opacity = '0';
                    
                    // 3. Wait 1 second for fade to finish, then remove from DOM
                    setTimeout(() => {
                        msg.remove();
                    }, 1000);
                }, 60000);
            })();
        </script>
    </div>
</div>
